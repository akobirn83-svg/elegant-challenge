if(p==='admin')h=`<h1>${t('admin')}</h1>${stat([[t('pend'),c(u=>u.st==='pending')],[t('stud'),c(u=>u.ty==='student')],[t('teach'),c(u=>u.ty==='teacher')],[t('susp'),c(u=>u.st==='suspended')]])}<h2>${t('pend')}</h2>${utable(U.filter(u=>u.st==='pending'),0)}`;
if(p==='users')h=`<h1>${t('users')}</h1>${utable(U,1)}`;
if(p==='audit')h=`<h1>${t('audit')}</h1>${AL.length?`<div class="tw"><table><tr><th>${t('when')}</th><th>${t('who')}</th><th>${t('what')}</th><th>${t('target')}</th></tr>${AL.map(a=>`<tr><td>${a[0]}</td><td>${a[1]}</td><td>${a[2]}</td><td>${esc(a[3])}</td></tr>`).join('')}</table></div>`:es(['—'])}`;
m.innerHTML=h}
function utable(a,adm){if(!a.length)return es(['—']);return `<div class="tw"><table><tr><th>${t('name')}</th><th>${t('un')}</th><th>${t('cls')}</th><th>${t('role')}</th><th>${t('status')}</th><th></th></tr>${a.map(u=>`<tr><td>${esc(u.fn)} ${esc(u.ln)}</td><td>${esc(u.un)}</td><td>${esc(u.cls)||'—'}</td><td>${u.ro}</td><td>${u.st}</td><td>${u.st==='pending'?`<button class="btn" onclick="ust('${u.id}','approved')">${t('approve')}</button> <button class="btn s" onclick="ust('${u.id}','rejected')">${t('reject')}</button>`:''}${adm&&u.st==='approved'&&u.ro!=='super'&&can('super')?(u.ro==='admin'?`<button class="btn d" onclick="uadm('${u.id}',0)">${t('demote')}</button>`:`<button class="btn" onclick="uadm('${u.id}',1)">${t('promote')}</button>`):''}</td></tr>`).join('')}</table></div>`}
const lg=()=>{};
async function ust(id,s){if(!can('admin'))return toast(t('denied'));const {error}=await sb.rpc('set_account_status',{target:id,new_status:s});if(error)return toast(t('err'));await loadUsers();page()}
async function uadm(id,on){if(!can('super'))return toast(t('denied'));if(!confirm(t('confirm')))return;const {error}=await sb.rpc('set_admin_role',{target:id,make_admin:!!on});if(error)return toast(t('err'));await loadUsers();page()}
let qf={s:'',c:''};
function qMgr(){const L=Q.filter(q=>(!qf.c||q.c===qf.c)&&q.q.toLowerCase().includes(qf.s.toLowerCase()));
return `<h2>${t('addq')}</h2><div class="card"><label>${t('qtext')}</label><textarea id="qq" rows="2"></textarea><label>${t('ans')}</label><input type="text" id="qa"><div class="row"><select id="qc">${CATS.map(c=>`<option>${c}</option>`).join('')}</select><select id="qd"><option value="easy">${t('easy')}</option><option value="mid">${t('mid')}</option><option value="hard">${t('hard')}</option></select><input type="number" id="qt" value="30" min="5" style="width:110px" title="${t('tl')}"></div><label>${t('expl')}</label><input type="text" id="qe"><div class="row"><button class="btn" onclick="qAdd()">${t('save')}</button></div></div>
<div class="row"><input type="text" placeholder="${t('search')}" value="${esc(qf.s)}" oninput="qf.s=this.value;qList()" style="max-width:260px"><select onchange="qf.c=this.value;qList()"><option value="">${t('all')}</option>${CATS.map(c=>`<option ${qf.c===c?'selected':''}>${c}</option>`).join('')}</select></div><div id="ql">${qL(L)}</div>`}
const qL=L=>L.length?`<div class="tw"><table><tr><th>${t('tt')}</th><th>${t('ans')}</th><th>${t('cat')}</th><th>${t('dif')}</th><th>${t('tl')}</th><th></th></tr>${L.map(q=>`<tr><td style="white-space:normal;min-width:200px">${esc(q.q)}</td><td>${esc(q.a)}</td><td>${q.c}</td><td>${t(q.d)}</td><td>${q.t}</td><td><button class="btn s" onclick="qDel(${q.id})">${t('del')}</button></td></tr>`).join('')}</table></div>`:es(t('noQ'));
function qList(){$('ql').innerHTML=qL(Q.filter(q=>(!qf.c||q.c===qf.c)&&q.q.toLowerCase().includes(qf.s.toLowerCase())))}
function qAdd(){if(!can('admin'))return toast(t('denied'));const q=$('qq').value.trim(),a=$('qa').value.trim();if(!q||!a)return toast(t('bad'));Q.push({id:++qid,q,a,c:$('qc').value,d:$('qd').value,t:Math.max(5,+$('qt').value||30),e:$('qe').value.trim()});lg('question added',q.slice(0,40));page()}
function qDel(id){if(!can('admin'))return toast(t('denied'));if(!confirm(t('confirm')))return;Q.splice(Q.findIndex(x=>x.id===id),1);lg('question deleted',id);page()}
/* ---- Zakovat fullscreen game ---- */
let G=null;
function gOpen(){if(!can('teacher'))return toast(t('denied'));G={teams:[],sel:[],stage:'setup',i:0,st:'idle',end:0,left:30,got:{},form:false,dur:30};$('gm').hidden=false;$('app').hidden=true;fs();gDraw()}
function fs(){try{const e=document.documentElement;document.fullscreenElement?document.exitFullscreen():e.requestFullscreen&&e.requestFullscreen().catch(()=>{})}catch(e){}}
function gClose(){G=null;$('gm').hidden=true;$('app').hidden=false;try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}draw()}
const sorted=()=>[...G.teams].sort((a,b)=>b.s-a.s);
function gDraw(){const g=$('gm');const top=`<div class="row" style="justify-content:space-between"><div class="brand">Elegant <b>Challenge</b> · ${t('zakovat')}</div><div class="ctl"><button onclick="fs()">⛶ ${t('fs')}</button><button onclick="${G.stage==='play'?'gEnd()':'gClose()'}">${G.stage==='play'?t('end'):'✕'}</button></div></div>`;
if(G.stage==='setup'){const ok=G.teams.length&&G.sel.length;g.innerHTML=top+`<div style="max-width:900px;margin:auto"><h2>${t('teams')||'Teams'} (${G.teams.length})</h2><div class="row"><button class="btn" onclick="G.form=true;gDraw()">${t('addt')}</button></div>
${G.form?`<div class="card"><label>${t('tname')}</label><input type="text" id="tn"><label>${t('tmem')}</label><input type="text" id="tm"><div class="row"><button class="btn" onclick="tSave()">${t('save')}</button><button class="btn s" onclick="G.form=false;gDraw()">${t('cancel')}</button></div></div>`:''}
${G.teams.length?`<div class="grid">${G.teams.map(x=>`<div class="card"><b>${esc(x.n)}</b><div class="mu">${esc(x.m.join(', '))||'—'}</div><div>0</div><div class="row"><button class="btn s" onclick="tEdit(${x.id})">${t('edit')}</button><button class="btn s" onclick="tDel(${x.id})">${t('del')}</button></div></div>`).join('')}</div>`:es(t('noT'))}
<h2>${t('selq')} (${G.sel.length})</h2>${Q.length?`<div class="row"><select id="gc"><option value="">${t('all')}</option>${CATS.map(c=>`<option>${c}</option>`).join('')}</select><input type="number" id="gn" value="${Math.min(10,Q.length)}" min="1" max="${Q.length}" style="width:90px" title="${t('cnt')}"><button class="btn s" onclick="qPick()">${t('pick')}</button></div>`:es(t('noQ'))}
<div class="row"><label style="margin:0">${t('dur')}</label><input type="number" min="5" value="${G.dur}" style="width:90px" onchange="G.dur=Math.max(5,+this.value||30)"></div>
<div class="row"><button class="btn" style="padding:14px 24px;font-size:17px" ${ok?'':'disabled'} onclick="gGo()">${t('begin')}</button></div></div>`;return}
if(G.stage==='play'){const q=G.sel[G.i],rv=G.st==='revealed',up=G.st==='up'||rv;
g.innerHTML=top+`<div style="max-width:1100px;margin:auto"><div class="mu" style="text-align:center">${G.i+1} / ${G.sel.length} · ${q.c}</div><div class="qt">${esc(q.q)}</div><div class="big" id="tm" ${up?'style="color:var(--er);font-size:min(12vw,110px)"':''}>${up?t('up'):tv()}</div>
<div class="row" style="justify-content:center"><button class="btn" ${G.st!=='idle'?'disabled':''} onclick="zs()">${t('start')}</button><button class="btn s" ${G.st!=='running'?'disabled':''} onclick="zp()">${t('pause')}</button><button class="btn s" ${G.st!=='paused'?'disabled':''} onclick="zr()">${t('resume')}</button><button class="btn s" ${G.st!=='up'?'disabled':''} onclick="zv()">${t('reveal')}</button><button class="btn s" onclick="zn(-1)">${t('prev')}</button><button class="btn s" onclick="zn(1)">${G.i===G.sel.length-1?t('end'):t('next')}</button></div>
${rv?`<div class="qt ok">${esc(q.a)}</div>${q.e?`<div class="mu" style="text-align:center">${esc(q.e)}</div>`:''}`:''}
<div class="sc">${G.teams.map(x=>{const k=q.id+'-'+x.id,on=G.got[k];return `<div class="card"><div>${esc(x.n)}</div><b>${x.s}</b>${rv?`<button class="btn ${on?'s':''}" onclick="zpt(${x.id})">${on?t('ptundo'):t('ptadd')}</button>`:''}</div>`}).join('')}</div></div>`;return}
const r=sorted();g.innerHTML=top+`<div style="max-width:800px;margin:auto"><div class="qt">${t('winner')}: ${r.length?esc(r[0].n):'—'}</div><div class="tw"><table>${r.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.n)}</td><td><b>${x.s}</b></td></tr>`).join('')}</table></div><div class="note">${t('unsaved')}</div><div class="row"><button class="btn" onclick="gClose()">${t('close')}</button></div></div>`}
function tSave(){const n=$('tn').value.trim();if(!n)return toast(t('bad'));G.teams.push({id:++tid,n,m:$('tm').value.split(',').map(s=>s.trim()).filter(Boolean),s:0});G.form=false;gDraw()}
function tEdit(id){const x=G.teams.find(y=>y.id===id),n=prompt(t('tname'),x.n);if(n&&n.trim())x.n=n.trim();const m=prompt(t('tmem'),x.m.join(', '));if(m!==null)x.m=m.split(',').map(s=>s.trim()).filter(Boolean);gDraw()}
function tDel(id){if(confirm(t('confirm'))){G.teams=G.teams.filter(x=>x.id!==id);gDraw()}}
function qPick(){const c=$('gc').value,n=Math.max(1,+$('gn').value||1);G.sel=Q.filter(q=>!c||q.c===c).slice(0,n);gDraw()}
function gGo(){G.stage='play';G.i=0;G.st='idle';G.left=G.sel[0].t||G.dur;G.got={};gDraw()}
const tv=()=>G.st==='running'?Math.max(0,Math.ceil((G.end-Date.now())/1000)):G.left;
function zs(){G.st='running';G.end=Date.now()+G.left*1000;gDraw()}
function zp(){G.left=tv();G.st='paused';gDraw()}
function zr(){G.st='running';G.end=Date.now()+G.left*1000;gDraw()}
function zv(){G.st='revealed';gDraw()}
function zn(d){const j=G.i+d;if(j>=G.sel.length)return gEnd();if(j<0)return;G.i=j;G.st='idle';G.left=G.sel[j].t||G.dur;gDraw()}
function zpt(id){const q=G.sel[G.i],k=q.id+'-'+id,x=G.teams.find(y=>y.id===id);if(G.got[k]){G.got[k]=0;x.s--}else{G.got[k]=1;x.s++}gDraw()}
function gEnd(){if(confirm(t('confirm'))){G.stage='end';gDraw()}}
setInterval(()=>{if(G&&G.stage==='play'&&G.st==='running'){if(Date.now()>=G.end){G.st='up';gDraw()}else{const e=$('tm');if(e)e.textContent=tv()}}},250);
(async()=>{if(sb){const {data}=await sb.auth.getSession();if(data.session){await enter(data.session.user,false);return}}draw()})();
</script></body></html>
